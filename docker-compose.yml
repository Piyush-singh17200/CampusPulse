services:
  postgres:
    image: postgres:17-alpine
    container_name: campuspulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campuspulse
      POSTGRES_PASSWORD: campuspulse
      POSTGRES_DB: campuspulse
    ports:
      - "5434:5432"
    volumes:
      - campuspulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuspulse -d campuspulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campuspulse_postgres_data:
